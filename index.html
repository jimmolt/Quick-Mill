canvas{touch-action:none;flex:1;min-height:0;width:100%;border-radius:6px;background:var(--code);cursor:crosshair}
.out{display:flex;flex-direction:column;min-height:0}
.sp{flex:1}

#view-tools,#view-help,#view-defs{overflow:auto}
.tw{overflow-x:auto}
table.tools{border-collapse:collapse;width:100%;min-width:980px}

table.tools input{padding:5px 6px}
table.tools .n{width:62px}table.tools .d{min-width:230px}
.tbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px;align-items:center}
.help{max-width:820px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
.help h2{margin:0 0 6px;font-size:16px}.help p,.help li{color:var(--ink)}.help ul,.help ol{margin:4px 0;padding-left:20px}
.help code{font:13px ui-monospace,Menlo,Consolas,monospace;background:var(--code);padding:1px 5px;border-radius:4px}
#toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--hd);color:#fff;padding:9px 16px;border-radius:8px;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90vw;z-index:9}

@media (max-width:900px){body{height:auto}#view-prog{grid-template-columns:1fr;gap:12px}.split.v{display:none}#left{overflow:visible}#right{grid-template-rows:var(--th,340px) 12px 420px}.hbtns{margin-left:0}}

#guide{display:flex;flex-direction:column;flex:1;min-height:0;padding:0;overflow:hidden}

.gb.me{align-self:flex-end;background:var(--hd);color:#fff;border-bottom-right-radius:4px;cursor:pointer}
.gb.me:hover{outline:2px solid var(--acc)}
.gb.cur{background:var(--sel);border-color:var(--acc);font-size:16px;max-width:100%}
.gb.cur span{display:block;font-size:13px;color:var(--mut);margin-top:4px}
.gans{padding:12px;border-top:1px solid var(--line);background:var(--card)}
.gopts{display:grid;gap:8px}.gopts.c2{grid-template-columns:1fr 1fr}.gopts.c4{grid-template-columns:repeat(4,1fr)}
.gopts button{padding:12px 10px;text-align:left;font-size:15px;border-radius:9px;min-height:50px}
.gopts.c4 button{text-align:center;padding:9px 4px;font-size:14px;min-height:0}
.gopts button span{display:block;font-size:12px;color:var(--mut);font-weight:400;margin-top:2px}
.gopts button.pri{grid-column:1/-1;text-align:center}.gopts button.pri span{color:#1d2327}
.gin{display:flex;gap:10px;align-items:center}
.gin label{display:flex;align-items:center;gap:6px;flex:1;font-weight:600;color:var(--mut)}
.gin input{font-size:20px;padding:10px}
.gin button{padding:11px 18px;font-size:15px}
.gchips{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.gchips button{border-radius:999px;padding:6px 13px}
.gerr{color:var(--err);font-size:13px;min-height:18px;margin-top:6px}
#gdone{border-color:var(--acc);font-size:14px;line-height:1.55}
#gdone .e{color:var(--err);font-weight:600}#gdone .t{display:block;margin:4px 0;color:var(--wrn);background:var(--wrnbg);padding:5px 8px;border-radius:6px}
#gdone button{margin-top:6px}
button.big{font-size:16px;padding:12px 22px;margin:10px 0}

/* peck / step notes */
.steps .sl .stnote{display:inline;margin-left:8px;font-size:11px;font-weight:400;color:var(--mut)}

#view-tools{display:flex;flex-direction:column}

.tgrid{display:grid;grid-template-columns:minmax(300px,420px) minmax(280px,1fr);gap:18px;align-items:start}

#tdet h3{margin:0 0 4px;font-size:16px}

.mag{width:100%;height:auto;display:block;max-width:420px;margin:0 auto}

.mag text{text-anchor:middle;fill:var(--ink);pointer-events:none}
.mag .pn{font:700 11.5px system-ui,sans-serif}
.mag .pd{font:600 9.5px ui-monospace,Menlo,monospace;fill:var(--mut)}
.mag .pk:not(.full) .pn{fill:var(--mut);font-weight:500}
.mag .mc1{font:700 14px system-ui,sans-serif}
.mag .mc2{font:12px system-ui,sans-serif;fill:var(--mut)}
.maglg{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:11.5px;color:var(--mut);justify-content:center;margin-top:6px;align-items:center}

.chipb{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:3px 10px;font:inherit;font-size:12px;cursor:pointer}

.presrow{margin-top:8px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
table.tools tr.tsel td{background:var(--sel)}
table.tools .ic{position:relative}
table.tools .dot{position:absolute;top:2px;right:2px;width:6px;height:6px;border-radius:50%;background:var(--acc)}
.dgrid{grid-template-columns:repeat(2,1fr)}
@media (max-width:640px){.dgrid{grid-template-columns:1fr}}

.gopts.c3{grid-template-columns:repeat(3,1fr)}
.gopts.c3 button{text-align:center;padding:8px 4px;font-size:13px;min-height:0}
.gopts.c3 button b{font-size:13px}
.orig{display:flex;gap:14px;align-items:center;flex-wrap:wrap;border:1px solid var(--line);border-radius:8px;padding:8px 10px}

.orig .oc{color:var(--accink);font-weight:600}
.osvg{width:190px;flex:none;display:block}
.gpic{margin-top:8px}.gpic .osvg{width:210px;margin:0 auto}

.seg{display:flex;margin-top:6px}

<body>
<header>
  <div class="brand"><svg viewBox="0 0 32 32" width="28" height="28" aria-hidden="true"><path d="M12 3h8v14l-4 5-4-5z" fill="var(--acc)"/><rect x="4" y="25" width="24" height="4" rx="1" fill="#9fb0b8"/></svg>
    <div><b>Quick Mill</b><span>Haas TM-2P</span></div></div>
  <nav id="tabs">
    <button data-act="tab" data-tab="prog" class="on">Program</button>
    <button data-act="tab" data-tab="tools">Tools</button>
    <button data-act="tab" data-tab="defs">Defaults</button>
    <button data-act="tab" data-tab="help">Help</button>
  </nav>
  <div class="hbtns">
    <button data-act="guide" class="pri">Guide me</button>
    <button data-act="example">Example</button>
    <button data-act="importJob">Open job</button>
    <button data-act="exportJob">Save job</button>
    <button data-act="newJob" data-confirm="1">New</button>
  </div>
</header>
<main id="view-prog">
  <section id="left">
    <div class="card" id="guide" hidden></div>
    <div class="card" id="gdone" hidden></div>
    <div class="card" id="job"></div>
    <div id="feats"></div>

      <div id="drawbar"></div>
      <div class="pvhead"><span id="readout"></span><span class="legend"><i class="lf"></i>cut <i class="lr"></i>rapid</span>
        <label class="mini"><input type="checkbox" id="shade" checked> shaded</label><label class="mini"><input type="checkbox" id="rapids" checked> rapids</label></div>
      <canvas id="cv"></canvas>
      <div class="simbar"><button id="simplay" data-act="play" class="pri" title="Play the toolpath">&#9654;</button><input type="range" id="simpos" min="0" max="1000" value="1000"><select id="simspeed" title="Playback speed"><option value="0.5">Slow</option><option value="1" selected>Normal</option><option value="3">Fast</option></select><span id="simread"></span></div>
    </div>

<script>
/* Quick Mill engine: feeds, toolpaths and Haas NGC G-code. No DOM in this file. */

  window.addEventListener('resize', draw);
  if (window.ResizeObserver) new ResizeObserver(draw).observe($('#cv'));
  if (window.matchMedia) { const mq = window.matchMedia('(prefers-color-scheme:dark)'); if (mq.addEventListener) mq.addEventListener('change', draw); }
  if (inFrame) { $('#dl').hidden = true; }
  /* ---------- resizable panels ---------- */
  function applySizes() {
    const m = $('#view-prog'), r = $('#right');
    if (S.lw) m.style.setProperty('--lw', S.lw + 'px'); else m.style.removeProperty('--lw');
    if (S.th) r.style.setProperty('--th', S.th + 'px'); else r.style.removeProperty('--th');
  }
  [['#splitV', 'lw'], ['#splitH', 'th']].forEach(q => {
    const el = $(q[0]), k = q[1]; let on = false;
    el.addEventListener('pointerdown', e => { on = true; el.classList.add('drag'); try { el.setPointerCapture(e.pointerId); } catch (x) { } e.preventDefault(); });
    el.addEventListener('pointermove', e => {
      if (!on) return;
      if (k === 'lw') { const b = $('#view-prog').getBoundingClientRect(); S.lw = Math.round(Math.max(280, Math.min(b.width - 340, e.clientX - b.left - 18))); }
      else { const b = $('#right').getBoundingClientRect(); S.th = Math.round(Math.max(120, Math.min(b.height - 140, e.clientY - b.top - 6))); }
      applySizes(); draw();
    });
    const end = () => { if (!on) return; on = false; el.classList.remove('drag'); save(); draw(); };
    el.addEventListener('pointerup', end); el.addEventListener('pointercancel', end);
    el.addEventListener('dblclick', () => { S[k] = null; applySizes(); save(); draw(); });
  });
  applySizes();
  $('#shade').checked = !S.shadeOff;
  window.__qmview = () => view; window.__qmset = n => setView(n);
  normalize(); if (!S.feats.length) setTimeout(startGuide, 0);
  renderJob(); renderAdd(); renderBar(); refresh(true);
})();

</script>
